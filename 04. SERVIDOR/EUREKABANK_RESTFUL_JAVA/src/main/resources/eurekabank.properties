# =============================================================================
# EURECABANK - Configuracion por defecto del servidor SOAP
# =============================================================================
# Estos valores son los que se usan cuando no hay variable de entorno ni
# propiedad del sistema que los sobrescriban. El orden de resolucion es:
#   1) variable de entorno
#   2) propiedad del sistema (-D...)
#   3) este fichero
#   4) valor por defecto escrito en el codigo
#
# Variables de entorno equivalentes:
#   EUREKABANK_DB_URL, EUREKABANK_DB_USUARIO, EUREKABANK_DB_CLAVE,
#   EUREKABANK_TOKEN_MINUTOS, EUREKABANK_ORIGENES_CORS
# =============================================================================

# URL del JDBC. La del laboratorio de pruebas es el puerto 3307:
#   jdbc:mysql://127.0.0.1:3307/eurekabank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil
eurekabank.db.url=jdbc:mysql://127.0.0.1:3306/eurekabank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil

# Usuario y clave de la aplicacion sobre la base de datos.
eurekabank.db.usuario=eurekabank_app
eurekabank.db.clave=EurekaBank2026!

# Vigencia del token de sesion, en minutos (regla RB-14).
eurekabank.token.minutos=30

# Origenes permitidos por el filtro CORS. El cliente web corre en el 4200.
eurekabank.cors.origenes=*
